/* Persistence hook — uses the browser's own localStorage              */
/* ------------------------------------------------------------------ */

const STORAGE_KEY = "finance-dashboard-state-v1";

function useFinanceStore() {
  const [data, setData] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore corrupt data */ }
    return buildSeed();
  });

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* storage full or blocked; ignore */ }
  }, [data]);

  return [data, setData];
}

function ProgressBar({ value, max, color }) {
  const p = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  const over = value > max;
  return (
    <div className="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
      <div
        className="h-full rounded-full transition-all"
        style={{ width: `${p}%`, backgroundColor: over ? RED : color || BLUE }}
      />
    </div>
  );
}

function Trend({ delta, invert = false, suffix = "" }) {
  if (delta === null || delta === undefined || !isFinite(delta)) return null;
  const good = invert ? delta <= 0 : delta >= 0;
  const IconEl = delta === 0 ? Minus : good ? ArrowUpRight : ArrowDownRight;
  const color = delta === 0 ? "text-slate-400" : good ? "text-emerald-600" : "text-red-600";
  return (
    <span className={`inline-flex items-center gap-0.5 text-xs font-medium ${color}`}>
      <IconEl size={13} strokeWidth={2.5} />
      {fmt(Math.abs(delta))}
      {suffix}
    </span>
  );
}

function IconButton({ onClick, title, children }) {

}

/* ------------------------------------------------------------------ */
/* Generic editable list — used for assets/liabilities/cards/fixed/budgets */
/* ------------------------------------------------------------------ */

function EditableList({ columns, rows, onChange, addDefaults, renderRowExtra, addLabel = "新增項目" }) {
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [adding, setAdding] = useState(false);

  const startEdit = (row) => { setEditingId(row.id); setDraft({ ...row }); };
  const cancel = () => { setEditingId(null); setDraft(null); setAdding(false); };
  const save = () => {
    if (!draft) return;
    if (adding) {
      onChange([...rows, { ...draft, id: uid() }]);
    } else {
      onChange(rows.map((r) => (r.id === editingId ? { ...draft } : r)));
    }
    cancel();
  };
  const remove = (id) => {
    if (window.confirm("確定要刪除這筆資料嗎？")) onChange(rows.filter((r) => r.id !== id));
  };
  const beginAdd = () => { setAdding(true); setEditingId("new"); setDraft({ ...addDefaults }); };

  const renderField = (col) => {
    const val = draft?.[col.key] ?? "";
    if (col.type === "select") {
      return (
        <select
          value={val}
          onChange={(e) => setDraft({ ...draft, [col.key]: e.target.value })}
          className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 bg-white"
        >
          {col.options.map((o) => (
            <option key={o} value={o}>{o}</option>
          ))}
        </select>
      );
    }
    return (
      <input
        type={col.type === "number" ? "number" : col.type === "date" ? "date" : "text"}
        value={val}
        onChange={(e) => setDraft({ ...draft, [col.key]: e.target.value })}
        className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5"
      />
    );
  };

  return (
    <div className="space-y-1.5">
      {rows.map((row) => (
        <div key={row.id} className="group">
          {editingId === row.id ? (
            <div className="flex flex-wrap items-center gap-2 bg-slate-50 rounded-lg p-2">
              {columns.map((col) => (
                <div key={col.key} className="flex-1 min-w-[90px]">
                  {renderField(col)}
                </div>
              ))}
              <button onClick={save} className="text-xs font-medium text-white bg-slate-900 rounded-lg px-3 py-1.5">儲存</button>
              <button onClick={cancel} className="text-xs font-medium text-slate-500 px-2 py-1.5">取消</button>
            </div>
          ) : (
            <div className="flex items-center justify-between rounded-lg px-1 py-1.5 hover:bg-slate-50">
              <div className="flex-1">{renderRowExtra(row)}</div>
              <div className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                <IconButton onClick={() => startEdit(row)} title="編輯"><Pencil size={14} /></IconButton>
                <IconButton onClick={() => remove(row.id)} title="刪除"><Trash2 size={14} /></IconButton>
              </div>
            </div>
          )}
        </div>
      ))}
      {adding && (
        <div className="flex flex-wrap items-center gap-2 bg-slate-50 rounded-lg p-2">
          {columns.map((col) => (
            <div key={col.key} className="flex-1 min-w-[90px]">
              {renderField(col)}
            </div>
          ))}
          <button onClick={save} className="text-xs font-medium text-white bg-slate-900 rounded-lg px-3 py-1.5">新增</button>
          <button onClick={cancel} className="text-xs font-medium text-slate-500 px-2 py-1.5">取消</button>
        </div>
      )}
      {!adding && (
        <button onClick={beginAdd} className="w-full flex items-center justify-center gap-1.5 text-xs font-medium text-slate-500 hover:text-slate-800 border border-dashed border-slate-300 rounded-lg py-2 mt-1">
          <Plus size={14} /> {addLabel}
        </button>
      )}
    </div>
  );
}

  }, [tab]);

  const submit = () => {

      if (!txn.name || !txn.amount) return;
      onAddTransaction({ id: uid(), type: tab, date: txn.date, category: txn.category, name: txn.name, amount: Number(txn.amount), method: txn.method, note: txn.note, isFixed: false });
    } else if (tab === "cardSpend") {

    } else if (tab === "asset") {
      if (!asset.name || !asset.amount) return;
      onAddAsset({ id: uid(), name: asset.name, category: asset.category, amount: Number(asset.amount) });

                <label className={labelCls}>名稱</label>

function App() {
  const [data, setData] = useFinanceStore();
  const [monthKey, setMonthKey] = useState(monthKeyOf(todayISO()));
  const [showAdd, setShowAdd] = useState(false);
  const [showManage, setShowManage] = useState(null);
  const [showMobileMenu, setShowMobileMenu] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [syncCode, setSyncCode] = useState(() => {
    try {
      let code = localStorage.getItem(SYNC_CODE_KEY);
      if (!code) {
        code = genSyncCode();
        localStorage.setItem(SYNC_CODE_KEY, code);
      }
      return code;
    } catch (e) {
      return genSyncCode();
    }
  });
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | synced | offline | error
  const [conflict, setConflict] = useState(null); // {local:{payload,updatedAt}, remote:{payload,updatedAt}}
  const conflictRef = useRef(null);
  const [cloudHistory, setCloudHistory] = useState([]); // last up-to-3 archived versions from the cloud doc
  const applyingRemoteRef = useRef(false);
  const lastPushedRef = useRef(null);
  const dataRef = useRef(data);
  const localUpdatedAtRef = useRef(new Date());
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!data) return;
    const realMonth = monthKeyOf(todayISO());
    const totalAssets = data.assets.reduce((s, a) => s + Number(a.amount || 0), 0);
    const cardUnpaid = (data.creditCards || []).reduce((s, c) => s + Number(c.unpaidAmount || 0), 0);
    const totalLiabilities = (data.liabilities || []).filter((l) => l.category !== "信用卡未繳").reduce((s, l) => s + Number(l.amount || 0), 0) + cardUnpaid;
    const netWorth = totalAssets - totalLiabilities;
    const hist = data.netWorthHistory || [];
    const idx = hist.findIndex((h) => h.monthKey === realMonth);
    const same = idx >= 0 && hist[idx].totalAssets === totalAssets && hist[idx].totalLiabilities === totalLiabilities;
    if (!same) {
      const next = [...hist];
      const entry = { monthKey: realMonth, totalAssets, totalLiabilities, netWorth };
      if (idx >= 0) next[idx] = entry; else next.push(entry);
      next.sort((a, b) => (a.monthKey < b.monthKey ? -1 : 1));
      setData((d) => ({ ...d, netWorthHistory: next.slice(-24) }));
    }
    // eslint-disable-next-line
  }, [data?.assets, data?.liabilities, data?.creditCards]);

  useEffect(() => {
    if (!data) return;
    const currentRealMonth = monthKeyOf(todayISO());
    const monthsToCheck = [shiftMonth(currentRealMonth, -1), currentRealMonth];
    const todayDay = new Date().getDate();
    let toAdd = [];
    let changed = false;
    const nextFixed = (data.fixedExpenses || []).map((f) => {
      let gm = f.generatedMonths || [];
      monthsToCheck.forEach((mk) => {
        if (gm.includes(mk)) return;
        const isCurrentMonth = mk === currentRealMonth;
        const dayArrived = !isCurrentMonth || todayDay >= (f.dayOfMonth || 1);
        if (!dayArrived) return;
        toAdd.push({ id: uid(), type: "expense", date: `${mk}-${pad2(Math.min(f.dayOfMonth || 1, 28))}`, category: f.category, name: f.name, amount: Number(f.amount), method: "轉帳", note: "固定支出自動產生", isFixed: true });
        gm = [...gm, mk];
        changed = true;
      });
      return { ...f, generatedMonths: gm };
    });
    if (changed) {
      setData((d) => ({ ...d, fixedExpenses: nextFixed, transactions: [...toAdd, ...d.transactions] }));
    }
    // eslint-disable-next-line
  }, [data?.fixedExpenses]);

  // ---- cloud sync: pull remote changes for this sync code (polling, not a live listener) ----
  // A continuous onSnapshot listener needs a long-lived streaming connection, which some
  // networks (corporate proxies, some routers) interfere with even when normal HTTPS requests
  // work fine. Polling with plain one-off requests avoids that problem entirely.
  useEffect(() => {
    if (!firestoreDb || !syncCode) { setSyncStatus("offline"); return; }
    let cancelled = false;
    const docRef = firestoreDb.collection("finance-dashboards").doc(syncCode);

    const pullOnce = async (isInitial) => {
      try {
        const snap = await docRef.get({ source: "server" });
        if (cancelled) return;
        if (snap.exists) {
          const remote = snap.data();
          setCloudHistory(Array.isArray(remote.history) ? remote.history : []);
          try {
            const parsed = JSON.parse(remote.payload);
            const serialized = JSON.stringify(parsed);
            if (serialized !== lastPushedRef.current) {
              const localSerialized = JSON.stringify(dataRef.current);
              if (serialized === localSerialized) {
                // remote matches what we already have locally — just note it, nothing to resolve
                lastPushedRef.current = serialized;
              } else if (!conflictRef.current) {
                // genuine divergence between this device and the cloud — ask the user which to keep
                conflictRef.current = true;
                setConflict({
                  local: { payload: dataRef.current, updatedAt: localUpdatedAtRef.current },
                  remote: { payload: parsed, updatedAt: remote.updatedAt || null },
                });
              }
            }
          } catch (e) { /* ignore malformed remote payload */ }
        } else if (isInitial && dataRef.current) {
          const payload = JSON.stringify(dataRef.current);
          lastPushedRef.current = payload;
          await docRef.set({ payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), history: [] });
        }
        if (!cancelled) setSyncStatus("synced");
      } catch (e) {
        if (!cancelled) setSyncStatus("error");
      }
    };

    setSyncStatus("syncing");
    pullOnce(true);
    const interval = setInterval(() => pullOnce(false), 20000);
    return () => { cancelled = true; clearInterval(interval); };
    // eslint-disable-next-line
  }, [syncCode, firestoreDb]);

  // ---- cloud sync: push local edits up (debounced), skipping echoes just received from remote ----
  useEffect(() => {
    dataRef.current = data;
    if (!data) return;
    if (applyingRemoteRef.current) { applyingRemoteRef.current = false; return; }
    localUpdatedAtRef.current = new Date();
    if (!firestoreDb || !syncCode || conflict) return;
    const payload = JSON.stringify(data);
    if (payload === lastPushedRef.current) return;
    const t = setTimeout(() => { pushToCloud(payload); }, 800);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [data, syncCode, conflict]);

  // Writes payloadStr as the new cloud document, archiving whatever was there before into history (max 3 entries).
  const pushToCloud = async (payloadStr) => {
    if (!firestoreDb || !syncCode) return;
    const docRef = firestoreDb.collection("finance-dashboards").doc(syncCode);
    setSyncStatus("syncing");
    try {
      let history = [];
      try {
        const snap = await docRef.get({ source: "server" });
        if (snap.exists) {
          const remote = snap.data();
          history = Array.isArray(remote.history) ? remote.history : [];
          if (remote.payload && remote.payload !== payloadStr) {
            history = [{ payload: remote.payload, updatedAt: remote.updatedAt || null }, ...history].slice(0, 3);
          }
        }
      } catch (e) { /* if we can't read the previous version, just proceed without archiving it */ }
      lastPushedRef.current = payloadStr;
      await docRef.set({ payload: payloadStr, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), history });
      setCloudHistory(history);
      setSyncStatus("synced");
    } catch (e) {
      setSyncStatus("error");
    }
  };

  const resolveConflictWithLocal = () => {
    if (!conflict) return;
    pushToCloud(JSON.stringify(conflict.local.payload));
    conflictRef.current = false;
    setConflict(null);
  };
  const resolveConflictWithRemote = () => {
    if (!conflict) return;
    lastPushedRef.current = JSON.stringify(conflict.remote.payload);
    applyingRemoteRef.current = true;
    setData(conflict.remote.payload);
    conflictRef.current = false;
    setConflict(null);
  };

  const restoreVersion = (entry) => {
    if (!window.confirm("還原後，這個版本會立即變成目前的資料（現在這份資料會被存進版本記錄，還原前的都還在，不會真的消失），確定要繼續嗎？")) return;
    try {
      const parsed = JSON.parse(entry.payload);
      applyingRemoteRef.current = true;
      setData(parsed);
      pushToCloud(entry.payload);
    } catch (e) {
      alert("這個版本的資料讀取失敗，無法還原。");
    }
  };

  const switchSyncCode = (newCode) => {
    const trimmed = (newCode || "").trim();
    if (!trimmed) return;
    try { localStorage.setItem(SYNC_CODE_KEY, trimmed); } catch (e) {}
    lastPushedRef.current = null;
    conflictRef.current = false;
    setConflict(null);
    setCloudHistory([]);
    setSyncCode(trimmed);
  };

  if (!data) return null;

  const { transactions, assets, liabilities, creditCards, fixedExpenses, budgets, netWorthHistory } = data;

  const setTransactions = (fn) => setData((d) => ({ ...d, transactions: typeof fn === "function" ? fn(d.transactions) : fn }));
  const setAssets = (fn) => setData((d) => ({ ...d, assets: typeof fn === "function" ? fn(d.assets) : fn }));
  const setLiabilities = (fn) => setData((d) => ({ ...d, liabilities: typeof fn === "function" ? fn(d.liabilities) : fn }));
  const setCreditCards = (fn) => setData((d) => ({ ...d, creditCards: typeof fn === "function" ? fn(d.creditCards) : fn }));
  const setFixedExpenses = (fn) => setData((d) => ({ ...d, fixedExpenses: typeof fn === "function" ? fn(d.fixedExpenses) : fn }));
  const setBudgets = (fn) => setData((d) => ({ ...d, budgets: typeof fn === "function" ? fn(d.budgets) : fn }));

  const prevMonthKey = shiftMonth(monthKey, -1);
  const txnsInMonth = (mk) => transactions.filter((t) => monthKeyOf(t.date) === mk);
  const sumByType = (list, type) => list.filter((t) => t.type === type).reduce((s, t) => s + Number(t.amount || 0), 0);

  const curTxns = txnsInMonth(monthKey);
  const prevTxns = txnsInMonth(prevMonthKey);

  const income = sumByType(curTxns, "income");
  const expense = sumByType(curTxns, "expense");
  const remaining = income - expense;
  const savingsRate = income > 0 ? remaining / income : 0;

  const prevIncome = sumByType(prevTxns, "income");
  const prevExpense = sumByType(prevTxns, "expense");
  const prevRemaining = prevIncome - prevExpense;

  const totalAssets = assets.reduce((s, a) => s + Number(a.amount || 0), 0);
  const totalCardCurrent = creditCards.reduce((s, c) => s + Number(c.currentAmount || 0), 0);
  const totalCardUnpaid = creditCards.reduce((s, c) => s + Number(c.unpaidAmount || 0), 0);
  const manualLiabilitiesTotal = liabilities.filter((l) => l.category !== "信用卡未繳").reduce((s, l) => s + Number(l.amount || 0), 0);
  const totalLiabilities = manualLiabilitiesTotal + totalCardUnpaid;
  const netWorth = totalAssets - totalLiabilities;

  const prevSnapshot = netWorthHistory.find((h) => h.monthKey === prevMonthKey);
  const netWorthDelta = prevSnapshot ? netWorth - prevSnapshot.netWorth : null;

  const expenseByCategory = EXPENSE_CATEGORIES.map((cat) => {
    const amt = curTxns.filter((t) => t.type === "expense" && t.category === cat).reduce((s, t) => s + Number(t.amount || 0), 0);
    const prevAmt = prevTxns.filter((t) => t.type === "expense" && t.category === cat).reduce((s, t) => s + Number(t.amount || 0), 0);
    return { category: cat, amount: amt, prevAmount: prevAmt, pctOfIncome: income > 0 ? amt / income : 0, pctOfExpense: expense > 0 ? amt / expense : 0 };
  }).filter((c) => c.amount > 0 || c.prevAmount > 0);

  const donutData = expenseByCategory.filter((c) => c.amount > 0).map((c) => ({ name: c.category, value: c.amount }));

  const expenseBreakdownSorted = [...expenseByCategory].filter((c) => c.amount > 0).sort((a, b) => b.amount - a.amount);
  const EXPENSE_BREAKDOWN_TOP_N = 5;
  const expenseBreakdownDisplay = expenseBreakdownSorted.slice(0, EXPENSE_BREAKDOWN_TOP_N).map((c) => ({ label: c.category, amount: c.amount, color: CAT_COLOR[c.category] }));
  const expenseBreakdownRestCount = expenseBreakdownSorted.length - EXPENSE_BREAKDOWN_TOP_N;
  if (expenseBreakdownRestCount > 0) {
    const restSum = expenseBreakdownSorted.slice(EXPENSE_BREAKDOWN_TOP_N).reduce((s, c) => s + c.amount, 0);
    expenseBreakdownDisplay.push({ label: `其他 ${expenseBreakdownRestCount} 項`, amount: restSum, color: "#cbd5e1" });
  }

  const fixedTotal = fixedExpenses.reduce((s, f) => s + Number(f.amount || 0), 0);
  const fixedRatio = income > 0 ? fixedTotal / income : 0;

  const debtRatio = totalAssets > 0 ? totalLiabilities / totalAssets : 0;

  const cash = assets.filter((a) => a.category === "現金" || a.category === "銀行存款").reduce((s, a) => s + Number(a.amount || 0), 0);
  const emergencyMonths = fixedTotal > 0 ? cash / fixedTotal : 99;

  const cashFlowMonths = lastNMonths(monthKey, 6);
  const cashFlowData = cashFlowMonths.map((mk) => {
    const list = txnsInMonth(mk);
    const inc = sumByType(list, "income");
    const exp = sumByType(list, "expense");
    return { month: monthLabel(mk).replace(" 年 ", "/").replace(" 月", ""), 收入: inc, 支出: exp, 剩餘: inc - exp };
  });

  const nwMonths = lastNMonths(monthKey, 12);
  const nwTrendData = nwMonths.map((mk) => {
    const snap = netWorthHistory.find((h) => h.monthKey === mk);
    if (snap) return { month: monthLabel(mk).replace(" 年 ", "/").replace(" 月", ""), 淨資產: snap.netWorth };
    if (mk === monthKeyOf(todayISO())) return { month: monthLabel(mk).replace(" 年 ", "/").replace(" 月", ""), 淨資產: netWorth };
    return { month: monthLabel(mk).replace(" 年 ", "/").replace(" 月", ""), 淨資產: null };
  });

  let score = 0;
  const reasons = [], warnings = [];
  if (savingsRate >= 0.3) { score += 30; reasons.push(`儲蓄率 ${pctStr(savingsRate)}`); }
  else if (savingsRate >= 0.15) { score += 20; reasons.push(`儲蓄率 ${pctStr(savingsRate)}`); }
  else if (savingsRate >= 0) { score += 10; warnings.push(`儲蓄率偏低（${pctStr(savingsRate)}）`); }
  else { warnings.push(`本月收支為負（${pctStr(savingsRate)}）`); }

  if (remaining >= 0) { score += 20; reasons.push("本月現金流為正"); }
  else { warnings.push("本月現金流為負"); }

  if (debtRatio < 0.4) { score += 20; reasons.push("負債比例正常"); }
  else if (debtRatio < 0.6) { score += 10; warnings.push(`負債占資產 ${pctStr(debtRatio)}，略高`); }
  else { warnings.push(`負債占資產高達 ${pctStr(debtRatio)}`); }

  if (fixedRatio < 0.5) { score += 15; }
  else if (fixedRatio < 0.7) { score += 8; warnings.push(`固定支出占收入 ${pctStr(fixedRatio)}`); }
  else { warnings.push(`固定支出占收入高達 ${pctStr(fixedRatio)}`); }

  if (emergencyMonths >= 3) { score += 15; reasons.push("有足夠緊急預備金"); }
  else if (emergencyMonths >= 1) { score += 8; warnings.push("緊急預備金略顯不足"); }
  else { warnings.push("緊急預備金不足 1 個月固定支出"); }

  score = Math.min(100, Math.round(score));
  const healthLabel = score >= 80 ? "良好" : score >= 60 ? "普通" : "需要留意";
  const healthColor = score >= 80 ? GREEN : score >= 60 ? AMBER : RED;

  const alerts = [];
  const daysUntil = (dateStr) => Math.ceil((new Date(dateStr) - new Date(todayISO())) / 86400000);
  creditCards.forEach((c) => {
    if (c.unpaidAmount > 0 && c.dueDate) {
      const d = daysUntil(c.dueDate);
      if (d >= 0 && d <= 5) alerts.push({ level: d <= 3 ? "red" : "amber", text: `${c.name} ${d === 0 ? "今天" : d + " 天後"}到期，未繳 ${fmt(c.unpaidAmount)}` });
    }
  });
  expenseByCategory.forEach((c) => {
    if (c.prevAmount > 0 && c.amount > c.prevAmount * 1.15) {
      alerts.push({ level: "amber", text: `${c.category} 支出比上月增加 ${fmt(c.amount - c.prevAmount)}` });
    }
  });
  budgets.forEach((b) => {
    const spent = curTxns.filter((t) => t.type === "expense" && t.category === b.category).reduce((s, t) => s + Number(t.amount || 0), 0);
    const p = b.limit > 0 ? spent / b.limit : 0;
    if (p >= 1) alerts.push({ level: "red", text: `${b.category}預算已超支 ${fmt(spent - b.limit)}` });
    else if (p >= 0.8) alerts.push({ level: "amber", text: `${b.category}已達本月預算 ${Math.round(p * 100)}%` });
  });
  if (remaining > 0) alerts.push({ level: "green", text: `本月已存下 ${fmt(remaining)}` });
  if (netWorthDelta !== null) {
    alerts.push({ level: netWorthDelta >= 0 ? "green" : "red", text: `淨資產較上月${netWorthDelta >= 0 ? "增加" : "減少"} ${fmt(Math.abs(netWorthDelta))}` });
  }

  const alertIcon = (lvl) => lvl === "red" ? <AlertTriangle size={14} className="text-red-600 shrink-0 mt-0.5" /> : lvl === "amber" ? <AlertTriangle size={14} className="text-amber-500 shrink-0 mt-0.5" /> : <CheckCircle2 size={14} className="text-emerald-600 shrink-0 mt-0.5" />;

  const addTransaction = (t) => setTransactions((list) => [t, ...list]);
  const addAsset = (a) => setAssets((list) => [...list, a]);
  const addLiability = (l) => setLiabilities((list) => [...list, l]);
  const cardSpend = (cardId, amount) => setCreditCards((list) => list.map((c) => (c.id === cardId ? { ...c, currentAmount: Number(c.currentAmount) + amount, unpaidAmount: Number(c.unpaidAmount) + amount } : c)));

  const generateFixedForMonth = () => {
    const toAdd = [];
    const nextFixed = fixedExpenses.map((f) => {
      if (f.generatedMonths?.includes(monthKey)) return f;
      toAdd.push({ id: uid(), type: "expense", date: `${monthKey}-${pad2(Math.min(f.dayOfMonth || 1, 28))}`, category: f.category, name: f.name, amount: Number(f.amount), method: "轉帳", note: "固定支出自動產生", isFixed: true });
      return { ...f, generatedMonths: [...(f.generatedMonths || []), monthKey] };
    });
    if (toAdd.length) {
      setTransactions((list) => [...toAdd, ...list]);
      setFixedExpenses(nextFixed);
    }
  };

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    downloadBlob(blob, `finance-backup-${todayISO()}.json`);
  };
  const exportCSV = () => {
    const header = ["日期", "類型", "分類", "名稱", "金額", "付款方式", "備註"];
    const rows = transactions.map((t) => [t.date, t.type === "income" ? "收入" : "支出", t.category, t.name, t.amount, t.method, (t.note || "").replace(/,/g, "，")]);
    const csv = [header, ...rows].map((r) => r.join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    downloadBlob(blob, `transactions-${todayISO()}.csv`);
  };
  const importJSON = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed !== "object") throw new Error("格式錯誤");
        setData({ ...EMPTY_STATE, ...parsed });
      } catch (err) {
        alert("匯入失敗：檔案格式不正確");
      }
    };
    reader.readAsText(file);
  };
  const resetAll = () => {
    if (window.confirm("這會清除所有資料並回到空白狀態，確定要繼續嗎？")) setData(EMPTY_STATE);
  };
  const restoreDemo = () => {
    if (window.confirm("這會覆蓋目前資料並套用示範資料，確定要繼續嗎？")) setData(buildSeed());
  };

  return (
    <div className="min-h-screen w-full bg-slate-50 text-slate-900" style={{ fontFeatureSettings: '"tnum"' }}>
      {/* Mobile top bar (shown below lg, since the sidebar is hidden there) */}
      <div className="lg:hidden flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200 sticky top-0 z-30">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-lg bg-slate-900 flex items-center justify-center">
            <Wallet size={14} className="text-white" />
          </div>
          <span className="font-semibold text-sm tracking-tight">財務控制中心</span>
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setShowSync(true)} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg hover:bg-slate-100">
            <span className={`w-2 h-2 rounded-full ${syncStatus === "synced" ? "bg-emerald-500" : syncStatus === "syncing" ? "bg-amber-400" : syncStatus === "error" ? "bg-red-500" : "bg-slate-300"}`} />
            <span className="text-xs text-slate-500">
              {syncStatus === "synced" ? "已同步" : syncStatus === "syncing" ? "同步中" : syncStatus === "error" ? "同步失敗" : "離線"}
            </span>
          </button>
          <button onClick={() => setShowMobileMenu(true)} className="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg">
            <Menu size={20} />
          </button>
        </div>
      </div>

      <div className="flex">
        <aside className="hidden lg:flex flex-col w-56 shrink-0 min-h-screen border-r border-slate-200 bg-white px-4 py-6">
          <div className="flex items-center gap-2 px-2 mb-8">
            <div className="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center">
              <Wallet size={16} className="text-white" />
            </div>
            <span className="font-semibold text-[15px] tracking-tight">財務控制中心</span>
          </div>
          <button onClick={() => setShowSync(true)} className="flex items-center gap-2 px-3 py-2 mb-4 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs">
            <span className={`w-2 h-2 rounded-full ${syncStatus === "synced" ? "bg-emerald-500" : syncStatus === "syncing" ? "bg-amber-400" : syncStatus === "error" ? "bg-red-500" : "bg-slate-300"}`} />
            <span className="text-slate-600">
              {syncStatus === "synced" ? "雲端已同步" : syncStatus === "syncing" ? "同步中…" : syncStatus === "error" ? "同步失敗" : "尚未連線"}
            </span>
          </button>
          <nav className="space-y-0.5 text-sm">
            <div className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-100 text-slate-900 font-medium">
              <Landmark size={15} /> 總覽 Dashboard
            </div>
            <button onClick={() => setShowManage("txns")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <Coins size={15} /> 收支明細
            </button>
            <button onClick={() => setShowManage("cards")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <CardIcon size={15} /> 信用卡管理
            </button>
            <button onClick={() => setShowManage("assets")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <PiggyBank size={15} /> 資產管理
            </button>
            <button onClick={() => setShowManage("liabilities")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <TrendingDown size={15} /> 負債管理
            </button>
            <button onClick={() => setShowManage("fixed")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <Settings2 size={15} /> 固定支出設定
            </button>
            <button onClick={() => setShowManage("budgets")} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800">
              <Bell size={15} /> 預算設定
            </button>
          </nav>
          <div className="mt-auto space-y-1 pt-6 border-t border-slate-100">
            <button onClick={exportJSON} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-xs">
              <Download size={14} /> 匯出 JSON
            </button>
            <button onClick={exportCSV} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-xs">
              <Download size={14} /> 匯出 CSV
            </button>
            <button onClick={() => fileInputRef.current?.click()} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-xs">
              <Upload size={14} /> 匯入資料
            </button>
            <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={(e) => e.target.files[0] && importJSON(e.target.files[0])} />
            <button onClick={resetAll} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600 text-xs">
              <RotateCcw size={14} /> 清除所有資料
            </button>
          </div>
        </aside>

        <main className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px]">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div>
              <h1 className="text-xl font-semibold text-slate-900">財務總覽</h1>
              <p className="text-xs text-slate-400 mt-0.5">打開網站的那一刻，就知道現在的財務狀況</p>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex items-center bg-white border border-slate-200 rounded-xl overflow-hidden">
                <button onClick={() => setMonthKey((m) => shiftMonth(m, -1))} className="p-2 text-slate-400 hover:text-slate-800 hover:bg-slate-50">
                  <ChevronLeft size={16} />
                </button>
                <span className="text-sm font-medium px-2 min-w-[96px] text-center tabular-nums">{monthLabel(monthKey)}</span>
                <button onClick={() => setMonthKey((m) => shiftMonth(m, 1))} className="p-2 text-slate-400 hover:text-slate-800 hover:bg-slate-50">
                  <ChevronRight size={16} />
                </button>
              </div>
              <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2.5 rounded-xl">
                <Plus size={16} /> 新增
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-4">
            <MetricCard label="總資產" value={fmt(totalAssets)} accent={BLUE} icon={PiggyBank} sub="現金＋股票＋ETF等" />
            <MetricCard label="總負債" value={fmt(totalLiabilities)} accent={RED} icon={TrendingDown} sub="房貸＋信用卡＋貸款" />
            <MetricCard label="淨資產" value={fmt(netWorth)} accent={netWorth >= 0 ? GREEN : RED} icon={Landmark} delta={netWorthDelta} big />
            <MetricCard label="本月收入" value={fmt(income)} accent={GREEN} icon={ArrowUpRight} delta={income - prevIncome} />
            <MetricCard label="本月支出" value={fmt(expense)} accent={RED} icon={ArrowDownRight} delta={expense - prevExpense} invert breakdown={expenseBreakdownDisplay} />
            <MetricCard label="本月剩餘" value={fmt(remaining)} accent={remaining >= 0 ? GREEN : RED} icon={Coins} sub={`儲蓄率 ${pctStr(savingsRate)}`} delta={remaining - prevRemaining} />
          </div>

          <Card className="mb-4">
            <SectionTitle right={<span className="text-xs text-slate-400">近 6 個月</span>}>本月現金流</SectionTitle>
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
              <div className="flex items-center gap-3 md:col-span-1">
                <div className="flex-1 space-y-2 text-sm">
                  <div className="flex justify-between"><span className="text-slate-500">收入</span><span className="font-medium tabular-nums text-emerald-600">{fmt(income)}</span></div>

function SyncModal({ onClose, syncCode, syncStatus, onSwitchCode, cloudHistory, onRestore }) {
  const [joinCode, setJoinCode] = useState("");
  const [copied, setCopied] = useState(false);
  const [checkResult, setCheckResult] = useState(null); // {status:'loading'|'ok'|'notfound'|'error', ...}

  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(syncCode);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      // clipboard API may be unavailable; user can still select the text manually
    }
  };

  const checkCloud = async () => {
    setCheckResult({ status: "loading" });
    if (!firestoreDb) {
      setCheckResult({ status: "error", message: "尚未連上 Firebase（firebase SDK 沒有載入成功）" });
      return;
    }
    try {
      const docRef = firestoreDb.collection("finance-dashboards").doc(syncCode);
      const snap = await docRef.get({ source: "server" }); // force a real round trip to the server, ignore local cache
      if (!snap.exists) {
        setCheckResult({ status: "notfound" });
        return;
      }
      const remote = snap.data();
      const parsed = JSON.parse(remote.payload);
      const totalAssets = (parsed.assets || []).reduce((s, a) => s + Number(a.amount || 0), 0);
      const cardUnpaid = (parsed.creditCards || []).reduce((s, c) => s + Number(c.unpaidAmount || 0), 0);
      const totalLiabilities = (parsed.liabilities || []).filter((l) => l.category !== "信用卡未繳").reduce((s, l) => s + Number(l.amount || 0), 0) + cardUnpaid;
      const txnCount = (parsed.transactions || []).length;
      const updatedAt = remote.updatedAt && remote.updatedAt.toDate ? remote.updatedAt.toDate() : null;
      setCheckResult({ status: "ok", totalAssets, totalLiabilities, txnCount, updatedAt });
    } catch (e) {
      setCheckResult({ status: "error", message: e.message || String(e) });
    }
  };

  const statusLabel = syncStatus === "synced" ? "已同步到雲端" : syncStatus === "syncing" ? "同步中…" : syncStatus === "error" ? "同步失敗（請檢查網路）" : "尚未連線";
  const statusColor = syncStatus === "synced" ? "text-emerald-600" : syncStatus === "syncing" ? "text-amber-600" : syncStatus === "error" ? "text-red-600" : "text-slate-400";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-md shadow-xl max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 pt-5 sticky top-0 bg-white">
          <h3 className="text-base font-semibold text-slate-800">雲端同步</h3>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 text-slate-400"><X size={18} /></button>
        </div>
        <div className="p-5 space-y-5">
          <div className="flex items-center justify-between">
            <div className={`text-sm font-medium ${statusColor}`}>● {statusLabel}</div>
            <button onClick={checkCloud} className="text-xs font-medium text-slate-600 border border-slate-300 rounded-lg px-2.5 py-1.5 hover:bg-slate-50">
              檢查雲端資料
            </button>
          </div>

          {checkResult && (
            <div className="text-xs rounded-lg border border-slate-200 bg-slate-50 p-3 space-y-1">
              {checkResult.status === "loading" && <div className="text-slate-500">正在向 Firebase 伺服器確認中…</div>}
              {checkResult.status === "notfound" && <div className="text-amber-600">雲端目前還沒有這組同步碼的資料（可能還沒同步過，或規則剛發布還在生效）。</div>}
              {checkResult.status === "error" && <div className="text-red-600">檢查失敗：{checkResult.message}</div>}
              {checkResult.status === "ok" && (
                <>
                  <div className="text-emerald-700 font-medium">✓ 已確認雲端伺服器上真的有這筆資料</div>
                  <div className="flex justify-between text-slate-600"><span>雲端總資產</span><span className="tabular-nums font-medium">{fmt(checkResult.totalAssets)}</span></div>
                  <div className="flex justify-between text-slate-600"><span>雲端總負債</span><span className="tabular-nums font-medium">{fmt(checkResult.totalLiabilities)}</span></div>
                  <div className="flex justify-between text-slate-600"><span>雲端收支筆數</span><span className="tabular-nums font-medium">{checkResult.txnCount} 筆</span></div>
                  <div className="flex justify-between text-slate-400"><span>雲端最後更新</span><span>{checkResult.updatedAt ? checkResult.updatedAt.toLocaleString("zh-TW") : "未知"}</span></div>
                  <div className="text-slate-400 pt-1">把上面「雲端總資產／總負債」對照畫面上的數字，一樣就代表真的同步成功了。</div>
                </>
              )}
            </div>
          )}

          <div>
            <div className="text-xs font-medium text-slate-500 mb-1.5">這台裝置的同步碼</div>
            <div className="flex items-center gap-2">
              <div className="flex-1 font-mono text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 select-all break-all">{syncCode}</div>
              <button onClick={copyCode} className="text-xs font-medium text-white bg-slate-900 rounded-lg px-3 py-2 shrink-0">
                {copied ? "已複製" : "複製"}
              </button>
            </div>
            <p className="text-xs text-slate-400 mt-2">把這組碼貼到其他裝置的「使用其他同步碼」欄位，兩邊就會看到同一份資料。</p>
          </div>

          <div className="pt-4 border-t border-slate-100">
            <div className="text-xs font-medium text-slate-500 mb-1.5">使用其他同步碼（在別的裝置設定過後，貼在這裡）</div>
            <div className="flex items-center gap-2">
              <input
                value={joinCode}
                onChange={(e) => setJoinCode(e.target.value)}
                placeholder="貼上同步碼"
                className="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-2 font-mono"
              />
              <button
                onClick={() => {
                  if (!joinCode.trim()) return;
                  if (window.confirm("切換同步碼後，畫面會改成顯示該同步碼底下的資料，確定要繼續嗎？")) {
                    onSwitchCode(joinCode.trim());
                    onClose();
                  }
                }}
                className="text-xs font-medium text-white bg-slate-900 rounded-lg px-3 py-2 shrink-0"
              >
                切換
              </button>
            </div>
          </div>

          <div className="pt-4 border-t border-slate-100">
            <div className="text-xs font-medium text-slate-500 mb-1.5">版本記錄（保留最近 3 次被覆蓋前的資料，可以還原）</div>
            {(!cloudHistory || cloudHistory.length === 0) && (
              <div className="text-xs text-slate-400">目前沒有歷史版本</div>
            )}
            <div className="space-y-2">
              {(cloudHistory || []).map((h, i) => {
                const s = summarizePayload(h.payload);
                return (
                  <div key={i} className="flex items-center justify-between text-xs border border-slate-200 rounded-lg px-3 py-2">
                    <div>
                      <div className="text-slate-600">{fmtSyncTime(h.updatedAt)}</div>
                      <div className="text-slate-400">淨資產 {s ? fmt(s.netWorth) : "—"} ・ {s ? s.txnCount : "—"} 筆收支</div>
                    </div>
                    <button onClick={() => onRestore(h)} className="text-xs font-medium text-white bg-slate-900 rounded-lg px-2.5 py-1.5 shrink-0">
                      還原
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ConflictModal({ conflict, onChooseLocal, onChooseRemote }) {
  const localSummary = summarizePayload(conflict.local.payload);
  const remoteSummary = summarizePayload(conflict.remote.payload);
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 p-4">
      <div className="bg-white rounded-2xl w-full max-w-md shadow-xl p-5">
        <h3 className="text-base font-semibold text-slate-800 mb-1">這台裝置跟雲端的資料不一樣</h3>
        <p className="text-xs text-slate-500 mb-4">請選擇要保留哪一份。沒被選到的那份會存進「版本記錄」，之後還是可以在「雲端同步」視窗裡還原回來，不會真的不見。</p>
        <div className="space-y-3">
          <button onClick={onChooseLocal} className="w-full text-left border border-slate-200 rounded-xl p-3 hover:border-slate-400 hover:bg-slate-50">
            <div className="text-sm font-medium text-slate-800 mb-1">使用「這台裝置」的資料（上傳，蓋過雲端）</div>
            <div className="text-xs text-slate-500">淨資產 {localSummary ? fmt(localSummary.netWorth) : "—"} ・ {localSummary ? localSummary.txnCount : "—"} 筆收支</div>
            <div className="text-xs text-slate-400 mt-1">最後修改：{fmtSyncTime(conflict.local.updatedAt)}</div>
          </button>
          <button onClick={onChooseRemote} className="w-full text-left border border-slate-200 rounded-xl p-3 hover:border-slate-400 hover:bg-slate-50">
            <div className="text-sm font-medium text-slate-800 mb-1">使用「雲端」的資料（下載，蓋過這台裝置）</div>
            <div className="text-xs text-slate-500">淨資產 {remoteSummary ? fmt(remoteSummary.netWorth) : "—"} ・ {remoteSummary ? remoteSummary.txnCount : "—"} 筆收支</div>
            <div className="text-xs text-slate-400 mt-1">最後修改：{fmtSyncTime(conflict.remote.updatedAt)}</div>
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
